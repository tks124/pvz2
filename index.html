        .announce-btn {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            z-index: 100;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .announce-btn:hover {
            transform: translateY(-50%) scale(1.04);
            box-shadow: 0 6px 25px rgba(245, 87, 108, 0.55);
        }

        .announce-btn:active {
            transform: translateY(-50%) scale(0.96);
        }

        .announce-btn .bell {
            display: inline-block;
            font-size: 1.2rem;
            animation: bell-ring 2s ease-in-out infinite;
            transform-origin: top center;
        }

        @keyframes bell-ring {
            0%, 80%, 100% { transform: rotate(0deg); }
            85% { transform: rotate(12deg); }
            90% { transform: rotate(-10deg); }
            95% { transform: rotate(6deg); }
        }

        .announce-btn .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ffdd59;
            border-radius: 50%;
            margin-left: 2px;
            animation: dot-pulse 1.6s ease-in-out infinite;
        }

        @keyframes dot-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }

        .unread-badge {
            display: none;
            position: absolute;
            top: -6px;
            right: -6px;

                    console.log('加载公告失败:', err);
                    if (announceListEl) {
                        announceListEl.innerHTML = '<div style="text-align:center;padding:30px;color:#f5576c;">公告加载失败，请刷新页面重试</div>';
                    }
                });

            function onAnnouncementsReady(callback) {
                if (announcementsLoaded) {
                    callback();
                } else {
                    announcementsCallbacks.push(callback);
                }
            }

            function reloadAnnouncements() {
                announceListEl.innerHTML = '<div style="text-align:center;padding:30px;color:#9ca3af;">正在加载公告...</div>';
                fetch('./gogao.json')
                    .then(function(response) { return response.json(); })
                    .then(function(data) {
                        announcements = data;
                        renderAnnouncements([]);
                        checkForNewAnnouncements();
                        markAllAsRead();
                    })
                    .catch(function(err) {
                        announceListEl.innerHTML = '<div style="text-align:center;padding:30px;color:#f5576c;">公告加载失败，请刷新页面重试</div>';
                        console.log('重新加载公告失败:', err);
                    });
            }

            var LS_KEY_LAST_SEEN = 'pvz2_announce_last_seen_v2';
            var LS_KEY_READ = 'pvz2_announce_read_v2';
            var LS_KEY_NOTIFIED = 'pvz2_announce_notified_v2';
            var LS_KEY_SHOWN = 'pvz2_announce_shown_v2';

            var announceListEl = document.getElementById('announceList');
            var announceBtn = document.getElementById('announceBtn');
            var unreadBadge = document.getElementById('unreadBadge');
            var modal = document.getElementById('announceModal');
            var modalCloseBtn = document.getElementById('modalCloseBtn');
            var toastContainer = document.getElementById('toastContainer');

            function getTodayString() {
                var now = new Date();
                var year = now.getFullYear();
                var month = String(now.getMonth() + 1).padStart(2, '0');
                var day = String(now.getDate()).padStart(2, '0');
                return year + '-' + month + '-' + day;
            }

            function extractDateFromStr(dateStr) {
                if (!dateStr) return null;
                var match = dateStr.match(/(\d{4}-\d{2}-\d{2})/);
                return match ? match[1] : null;
            }

            function getVisibleAnnouncements() {
                var today = getTodayString();
                return announcements.filter(function(item) {
                    var pubDate = item.publishDate ? extractDateFromStr(item.publishDate) : null;
                    if (!pubDate) return true;
                    return pubDate <= today;
                });
            }

            function getPublishedToday() {
                var today = getTodayString();
                return announcements.filter(function(item) {
                    var pubDate = item.publishDate ? extractDateFromStr(item.publishDate) : null;
                    if (!pubDate) return false;
                    return pubDate === today;
                });
            }

            function lsGet(key, defaultVal) {
                try {
                    var val = localStorage.getItem(key);
                    return val ? JSON.parse(val) : defaultVal;
                } catch (e) {
                    return defaultVal;
                }
            }

            function lsSet(key, val) {
                try {
                    localStorage.setItem(key, JSON.stringify(val));
                } catch (e) {
                }
            }

            function isNotificationSupported() {
                return 'Notification' in window;
            }

            function requestNotificationPermission() {
                if (!isNotificationSupported()) {
                    console.log('当前浏览器不支持 Notification API');
                    return;
                }
                if (Notification.permission === 'default') {
                    Notification.requestPermission().then(function(permission) {
                        console.log('通知权限状态:', permission);
                        if (permission === 'granted') {
                            console.log('通知权限已授予');
                        }
                    }).catch(function(err) {
                        console.log('请求通知权限失败:', err);
                    });
                }
            }

            function showSystemNotification(title, body) {
                if (!isNotificationSupported()) return;
                if (Notification.permission !== 'granted') {
                    console.log('通知权限未授予，无法发送系统通知');
                    return;
                }
                try {
                    var iconUrl = './tubiao.png';
                    var notif = new Notification(title, {
                        body: body,
                        icon: iconUrl,
                        badge: iconUrl,
                        tag: 'pvz2-announce-' + Date.now(),
                        requireInteraction: true
                    });
                    notif.onclick = function() {
                        window.focus();
                        openModal();
                        notif.close();
                    };
                    setTimeout(function() {
                        notif.close();
                    }, 8000);
                } catch (e) {
                    console.log('发送系统通知失败:', e);
                }
            }

            function createToast(newItems) {
                if (!newItems || newItems.length === 0) return;
                var icon = '📢';
                var titleText = '发现 ' + newItems.length + ' 条新公告';
                var latestContent = newItems[0].content;
                var messagePreview = latestContent.length > 50 ? latestContent.substring(0, 50) + '…' : latestContent;

                var toastItem = document.createElement('div');
                toastItem.className = 'toast-item';
                toastItem.setAttribute('role', 'alert');
                toastItem.innerHTML =
                    '<span class="toast-icon">' + icon + '</span>' +
                    '<div class="toast-content">' +
                    '<div class="toast-title">' + titleText + '</div>' +
                    '<div class="toast-message">' + messagePreview + '</div>' +
                    '</div>' +
                    '<button class="toast-close-btn" aria-label="关闭通知">✕</button>';

                toastItem.addEventListener('click', function(e) {
                    if (e.target.closest('.toast-close-btn')) return;
                    openModal();
                    removeToast(toastItem);
                });

                var closeBtn = toastItem.querySelector('.toast-close-btn');
                closeBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    removeToast(toastItem);
                });

                toastContainer.appendChild(toastItem);
                setTimeout(function() {
                    removeToast(toastItem);
                }, 5000);
            }

            function removeToast(toastItem) {
                if (!toastItem || toastItem.classList.contains('removing')) return;
                toastItem.classList.add('removing');
                setTimeout(function() {
                    if (toastItem.parentNode) {
                        toastItem.parentNode.removeChild(toastItem);
                    }
                }, 350);
            }

            function triggerNotification(newItems) {
                if (!newItems || newItems.length === 0) return;
                console.log('🔔 触发公告通知，新公告数量:', newItems.length);
                createToast(newItems);
                var sysTitle = '📢 PvZ2 有 ' + newItems.length + ' 条新公告';
                var sysBody = newItems[0].content.length > 60 ?
                    newItems[0].content.substring(0, 60) + '…' :
                    newItems[0].content;
                showSystemNotification(sysTitle, sysBody);
            }

            function renderAnnouncements(newDateSet) {
                var visible = getVisibleAnnouncements();
                var html = '';
                var newDateSetArr = newDateSet || [];
                visible.forEach(function(item) {
                    var isNew = newDateSetArr.indexOf(item.date) !== -1;
                    var newTagHtml = isNew ? '<span class="new-tag">NEW</span>' : '';
                    var newClass = isNew ? ' is-new' : '';
                    html +=
                        '<div class="announce-item' + newClass + '">' +
                        '<div class="date">' + item.date + newTagHtml + '</div>' +
                        '<div class="content">' + item.content + '</div>' +
                        '</div>';
                });
                announceListEl.innerHTML = html;
                if (visible.length === 0) {
                    announceListEl.innerHTML = '<div style="text-align:center;color:#9ca3af;padding:20px;">暂无公告</div>';
                }
            }

            function checkForNewAnnouncements() {
                var today = getTodayString();
                var visibleAnnouncements = getVisibleAnnouncements();
                var visibleDates = visibleAnnouncements.map(function(item) { return item.date; });
                var publishedToday = getPublishedToday();
                var publishedTodayDates = publishedToday.map(function(item) { return item.date; });

                var lastSeenDates = lsGet(LS_KEY_LAST_SEEN, null);
                var readDates = lsGet(LS_KEY_READ, []);
                var notifiedDates = lsGet(LS_KEY_NOTIFIED, []);
                var shownDates = lsGet(LS_KEY_SHOWN, []);

                if (lastSeenDates === null || !Array.isArray(lastSeenDates)) {
                    lsSet(LS_KEY_LAST_SEEN, visibleDates);
                    lsSet(LS_KEY_READ, visibleDates);
                    lsSet(LS_KEY_NOTIFIED, visibleDates);
                    lsSet(LS_KEY_SHOWN, visibleDates);
                    renderAnnouncements([]);
                    updateUnreadBadge(0);
                    console.log('首次访问，已记录所有可见公告');
                    return;
                }

                var newlyPublished = publishedTodayDates.filter(function(d) {
                    return notifiedDates.indexOf(d) === -1;
                });

                if (newlyPublished.length > 0) {
                    var newItems = announcements.filter(function(item) {
                        return newlyPublished.indexOf(item.date) !== -1;
                    });
                    triggerNotification(newItems);
                    var updatedNotified = notifiedDates.concat(newlyPublished);
                    lsSet(LS_KEY_NOTIFIED, updatedNotified);
                    lsSet(LS_KEY_SHOWN, lsGet(LS_KEY_SHOWN, []).concat(newlyPublished));
                }

                var unreadDates = visibleDates.filter(function(d) {
                    return readDates.indexOf(d) === -1;
                });

                var updatedLastSeen = visibleDates.filter(function(d) {
                    return lastSeenDates.indexOf(d) === -1;
                });
                if (updatedLastSeen.length > 0) {
                    lsSet(LS_KEY_LAST_SEEN, lastSeenDates.concat(updatedLastSeen));
                }

                renderAnnouncements(newlyPublished);
                updateUnreadBadge(unreadDates.length);
                console.log('公告检测完成 - 今日可见:', visibleDates.length, '条, 今日新发布:', newlyPublished.length, '条, 未读:', unreadDates.length, '条');
            }

            function updateUnreadBadge(count) {
                if (count > 0) {
                    unreadBadge.textContent = count > 99 ? '99+' : count;
                    unreadBadge.classList.add('show');
                } else {
                    unreadBadge.classList.remove('show');
                }
            }

            function markAllAsRead() {
                var visibleDates = getVisibleAnnouncements().map(function(item) { return item.date; });
                lsSet(LS_KEY_READ, visibleDates);
                updateUnreadBadge(0);
                renderAnnouncements([]);
            }

            function openModal() {
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
                if (isNotificationSupported() && Notification.permission === 'default') {
                    requestNotificationPermission();
                }
                reloadAnnouncements();
            }

            function closeModal() {
                modal.classList.remove('active');
                document.body.style.overflow = '';
            }

            var searchInput = document.getElementById('searchInput');
            var clearBtn = document.getElementById('clearBtn');
            var cards = document.querySelectorAll('.card');
            var noResult = document.getElementById('noResult');
            var searchStats = document.getElementById('searchStats');

            function performSearch() {
                var query = searchInput.value.toLowerCase().trim();
                var visibleCount = 0;
                if (query.length > 0) {
                    clearBtn.style.display = 'block';
                } else {
                    clearBtn.style.display = 'none';
                }
                cards.forEach(function(card) {
                    var nameAttr = card.getAttribute('data-name') || '';
                    if (nameAttr.toLowerCase().includes(query)) {
                        card.style.display = 'flex';
                        visibleCount++;
                    } else {
                        card.style.display = 'none';
                    }
                });
                if (query.length > 0) {
                    searchStats.textContent = '找到 ' + visibleCount + ' 个与 "' + searchInput.value + '" 匹配的关卡';
                } else {
                    searchStats.textContent = '';
                }
                if (visibleCount === 0 && query.length > 0) {
                    noResult.style.display = 'block';
                } else {
                    noResult.style.display = 'none';
                }
            }

            searchInput.addEventListener('input', performSearch);
            clearBtn.addEventListener('click', function() {
                searchInput.value = '';
                performSearch();
                searchInput.focus();
            });

            announceBtn.addEventListener('click', function() {
                openModal();
                if (isNotificationSupported() && Notification.permission === 'default') {
                    requestNotificationPermission();
                }
            });

            modalCloseBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    closeModal();
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    searchInput.value = '';
                    performSearch();
                    if (modal.classList.contains('active')) {
                        closeModal();
                    }
                }
            });

            function init() {
                var allCards = [];
                
                var p1 = fetch('./ID.json')
                    .then(function(response) { return response.json(); })
                    .then(function(data) {
                        data.forEach(function(item) {
                            allCards.push({
                                name: item.name,
                                androidId: item.androidId,
                                iosId: item.iosId
                            });
                        });
                    })
                    .catch(function(err) {
                        console.log('加载本地ID.json失败:', err);
                    });

                var p2 = new Promise(function(resolve) {
                    if (!supabaseClient) { resolve(); return; }
                    supabaseClient.from('pvz2_maps').select('*').eq('status', 'approved').order('created_at', {ascending: false})
                        .then(function(res) {
                            if (!res.error && res.data) {
                                res.data.forEach(function(item) {
                                    allCards.push({
                                        name: item.name,
                                        androidId: item.android_id,
                                        iosId: item.ios_id
                                    });
                                });
                            }
                            resolve();
                        })
                        .catch(function(err) {
                            console.log('加载Supabase地图失败:', err);
                            resolve();
                        });
                });

                Promise.all([p1, p2]).then(function() {
                    var cardGrid = document.getElementById('cardGrid');
                    var loadingMsg = document.getElementById('loadingMsg');
                    if (loadingMsg) {
                        loadingMsg.parentNode.removeChild(loadingMsg);
                    }
                    
                    if (allCards.length === 0) {
                        cardGrid.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-sub);grid-column:1/-1;">暂无数据</div>';
                    } else {
                        var cardsHtml = '';
                        allCards.forEach(function(item) {
                            cardsHtml +=
                                '<div class="card" data-name="' + item.name + '">' +
                                '<div class="card-header">🎉 地图ID</div>' +
                                '<div class="card-body">' +
                                '<p style="margin-bottom: 15px;">你好 <strong>用户</strong>,<br />以下就是地图ID：</p>' +
                                '<div class="info-group">' +
                                '<span class="info-label">📝 关卡名称</span>' +
                                '<div class="info-value">' + item.name + '</div>' +
                                '</div>' +
                                '<div class="info-group">' +
                                '<span class="info-label">🤖 Android 关卡 ID</span>' +
                                '<div class="info-value">' + item.androidId + '</div>' +
                                '</div>' +
                                '<div class="info-group">' +
                                '<span class="info-label">🍎 iOS 关卡 ID</span>' +
                                '<div class="info-value">' + item.iosId + '</div>' +
                                '</div>' +
                                '</div>' +
                                '</div>';
                        });
                        cardGrid.innerHTML = cardsHtml;
                    }

                    cards = document.querySelectorAll('.card');
                    performSearch();

                    onAnnouncementsReady(function() {
                        renderAnnouncements([]);
                        checkForNewAnnouncements();
                        if (isNotificationSupported() && Notification.permission === 'default') {
                            setTimeout(function() {
                                requestNotificationPermission();
                            }, 2000);
                        }
                    });
                });
            }

            init();

            document.getElementById('openUploadBtn').addEventListener('click', function() {
                document.getElementById('uploadModal').classList.add('active');
            });
        });

        function closeUpload() {
            document.getElementById('uploadModal').classList.remove('active');
        }

        async function submitUpload() {
            if (!supabaseClient) {
                document.getElementById('upStatus').textContent = "Supabase 未加载，请检查网络";
                return;
            }

            const name = document.getElementById('upName').value.trim();
            const android = document.getElementById('upAndroid').value.trim();
            const ios = document.getElementById('upIos').value.trim();
            const author = document.getElementById('upAuthor').value.trim();
            const other = document.getElementById('upOther').value.trim();
            const file = document.getElementById('upFile').files[0];
            const statusEl = document.getElementById('upStatus');

            if (!name || !android || !ios || !author) {
                statusEl.textContent = "名称、ID和作者名必须填写！";
                return;
            }

            statusEl.textContent = "正在上传...";
            statusEl.style.color = "#6b7280";

            let sourceUrl = "";
            if (file) {
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}_${Math.random().toString(36).slice(2)}.${fileExt}`;
                const uploadRes = await supabaseClient.storage.from('pvz2_sources').upload(fileName, file);
                if (uploadRes.error) {
                    statusEl.textContent = "文件上传失败: " + uploadRes.error.message;
                    return;
                }
                const publicUrl = supabaseClient.storage.from('pvz2_sources').getPublicUrl(fileName).data.publicUrl;
                sourceUrl = publicUrl;
            }

            const { data, error } = await supabaseClient.from('pvz2_maps').insert([{
                name: name, 
                android_id: android, 
                ios_id: ios, 
                author_name: author, 
                other_info: other, 
                source_url: sourceUrl, 
                status: 'pending'
            }]).select().single();

            if (error) {
                statusEl.textContent = "提交失败: " + error.message;
            } else {
                statusEl.textContent = "提交成功，请等待审核！";
                statusEl.style.color = "#10b981";
                setTimeout(() => {
                    closeUpload();
                    document.getElementById('upName').value = '';
                    document.getElementById('upAndroid').value = '';
                    document.getElementById('upIos').value = '';
                    document.getElementById('upAuthor').value = '';
                    document.getElementById('upOther').value = '';
                    document.getElementById('upFile').value = '';
                }, 1500);
            }
        }
    </script>
</body>
</html>
