<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PvZ2 高级创作 - 地图作者ID</title>
<style>
    :root { --primary-color: #667eea; --secondary-color: #764ba2; --bg-color: #f3f4f6; --card-bg: #ffffff; --text-main: #1f2937; --text-sub: #6b7280; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 40px; padding-top: 20px; }
    h1 { font-size: 2rem; background: linear-gradient(to right, var(--primary-color), var(--secondary-color)); -webkit-background-clip: text; color: transparent; margin-bottom: 10px; }
    .subtitle { color: var(--text-sub); font-size: 1.1rem; }
    .back-btn { display: inline-block; margin-bottom: 20px; padding: 10px 20px; background: #fff; color: var(--primary-color); text-decoration: none; border-radius: 50px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .search-wrapper { max-width: 600px; width: 90%; margin: 0 auto 40px auto; position: relative; }
    .search-box { width: 100%; padding: 14px 50px 14px 24px; font-size: 16px; border: 2px solid #e5e7eb; border-radius: 50px; outline: none; transition: all 0.3s; background: #fff; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .search-box:focus { border-color: var(--primary-color); box-shadow: 0 0 0 4px rgba(102,126,234,0.2); }
    .clear-btn { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); cursor: pointer; display: none; font-size: 1.2rem; background: none; border: none; color: #9ca3af; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
    .card { background: var(--card-bg); border-radius: 16px; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
    .card-header { background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); padding: 15px; text-align: center; color: white; font-weight: bold; font-size: 1.2rem; }
    .card-body { padding: 20px; flex-grow: 1; }
    .info-group { margin-bottom: 15px; padding: 10px; background-color: #f9fafb; border-radius: 8px; border-left: 4px solid var(--primary-color); }
    .info-label { display: block; font-size: 0.85rem; color: var(--primary-color); font-weight: 600; margin-bottom: 4px; }
    .info-value { font-family: 'Courier New', monospace; font-size: 1.1rem; color: #374151; word-break: break-all; }
    .no-result { grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-sub); font-size: 1.2rem; display: none; }
    @media (max-width: 600px) { h1 { font-size: 1.8rem; } .grid { grid-template-columns: 1fr; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="container">
<a href="index.html" class="back-btn">← 返回地图ID</a>
<header>
    <h1>植物大战僵尸2 - 地图作者<br><span style="font-size:1rem;opacity:0.9;">如需添加，请联系管理员 linjiayuan@spacekill124.cn</span></h1>
    <p class="subtitle">快速查找作者</p>
</header>

<div class="search-wrapper">
    <input class="search-box" id="searchInput" placeholder="搜索作者名称…" type="text"/>
    <button class="clear-btn" id="clearBtn">✕</button>
</div>

<div class="grid" id="cardsContainer">
    <div class="card" data-name="太空杀124">
        <div class="card-header">太空杀124</div>
        <div class="card-body">
            <div class="info-group"><span class="info-label">作者ID/哔哩哔哩</span><span class="info-value">482735934</span></div>
            <div class="info-group"><span class="info-label">代表作品</span><span class="info-value">倾听说唱</span></div>
        </div>
    </div>
    <div class="card" data-name="房主没神器">
        <div class="card-header">房主没神器</div>
        <div class="card-body">
            <div class="info-group"><span class="info-label">作者ID/哔哩哔哩</span><span class="info-value">3493259313679235</span></div>
            <div class="info-group"><span class="info-label">代表作品</span><span class="info-value">无</span></div>
        </div>
    </div>
</div>

<div class="no-result" id="noResult">未找到相关作者，请更换关键词</div>
</div>

<script>
    const SUPABASE_URL = "https://xryfrqxelzetzkgsaycl.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_bV150rxd0EeojJEL53Cgwg_Lc3ZUkoU";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadDynamicAuthors() {
        const { data, error } = await supabaseClient
            .from('pvz2_maps')
            .select('author_name')
            .eq('status', 'approved');

        if (!error && data) {
            const authors = [...new Set(data.map(item => item.author_name).filter(Boolean))];
            const container = document.getElementById('cardsContainer');
            const existingNames = Array.from(container.querySelectorAll('.card')).map(card => card.getAttribute('data-name'));

            authors.forEach(author => {
                if (!existingNames.includes(author)) {
                    const cardHtml = `
                    <div class="card" data-name="${author}">
                        <div class="card-header">${author}</div>
                        <div class="card-body">
                            <div class="info-group"><span class="info-label">作者信息</span><span class="info-value">通过地图审核自动收录</span></div>
                        </div>
                    </div>`;
                    container.insertAdjacentHTML('beforeend', cardHtml);
                }
            });
            setupSearch();
        }
    }

    function setupSearch() {
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const cards = document.querySelectorAll('.card');
        const noResult = document.getElementById('noResult');

        const newSearchInput = searchInput.cloneNode(true);
        searchInput.parentNode.replaceChild(newSearchInput, searchInput);

        newSearchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            let visibleCount = 0;
            clearBtn.style.display = query.length > 0 ? 'block' : 'none';

            cards.forEach(card => {
                const nameAttr = card.getAttribute('data-name') || '';
                if (nameAttr.toLowerCase().includes(query)) {
                    card.style.display = 'flex';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });
            noResult.style.display = (visibleCount === 0 && query.length > 0) ? 'block' : 'none';
        });

        clearBtn.onclick = function() {
            newSearchInput.value = '';
            newSearchInput.dispatchEvent(new Event('input'));
            newSearchInput.focus();
        };
    }

    window.addEventListener('DOMContentLoaded', () => {
        setupSearch();
        loadDynamicAuthors();
    });
</script>
</body>
</html>
