    .search-box {

        border: 2px solid #e5e7eb; border-radius: 50px; outline: none;
        transition: all 0.3s ease; background: #fff;

    .search-box:focus { border-color: var(--primary-color); box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2); }
    .clear-btn {
        position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
        cursor: pointer; display: none; font-size: 1.2rem; background: none; border: none; color: #9ca3af;
    }
    .clear-btn:hover { color: var(--text-main); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
    .card {
        background: var(--card-bg); border-radius: 16px; overflow: hidden;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease; display: flex; flex-direction: column;

    .card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
    .card-header {

    .info-group {

    .info-value { font-family: 'Courier New', Courier, monospace; font-size: 1.1rem; color: #374151; word-break: break-all; }
    .no-result { grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-sub); font-size: 1.2rem; display: none; }
    footer { text-align: center; margin-top: 50px; color: var(--text-sub); font-size: 0.9rem; }
    @media (max-width: 600px) {

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const cards = document.querySelectorAll('.card');
        const noResult = document.getElementById('noResult');

        function performSearch() {
            const query = searchInput.value.toLowerCase().trim();
            let visibleCount = 0;

            if (query.length > 0) {
                clearBtn.style.display = 'block';
            } else {
                clearBtn.style.display = 'none';
            }

            cards.forEach(card => {
                const nameAttr = card.getAttribute('data-name') || '';
                if (nameAttr.toLowerCase().includes(query)) {
                    card.style.display = 'flex';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            if (visibleCount === 0 && query.length > 0) {
                noResult.style.display = 'block';
            } else {
                noResult.style.display = 'none';
            }
        }

        searchInput.addEventListener('input', performSearch);
        clearBtn.addEventListener('click', function() {
            searchInput.value = '';
            performSearch();
            searchInput.focus();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                searchInput.value = '';
                performSearch();
            }
        });
    });
</script>
