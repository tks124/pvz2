<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>PvZ2 高级创作 - 地图源代码</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background-color: #f3f4f6; color: #1f2937; line-height: 1.6; padding: 20px; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; padding-top: 20px; }
        h1 { font-size: 2rem; background: linear-gradient(to right, #667eea, #764ba2); -webkit-background-clip: text; color: transparent; margin-bottom: 10px; }
        .subtitle { color: #6b7280; font-size: 1rem; }
        .back-btn { display: inline-block; margin-bottom: 20px; padding: 10px 20px; background: #fff; color: #667eea; text-decoration: none; border-radius: 50px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .list-group { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .list-item { padding: 15px 20px; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; }
        .list-item:last-child { border-bottom: none; }
        .item-info h3 { font-size: 1.1rem; margin-bottom: 4px; color: #374151; }
        .item-info p { font-size: 0.85rem; color: #6b7280; }
        .download-btn { padding: 8px 16px; background: #667eea; color: white; border-radius: 8px; text-decoration: none; font-size: 0.9rem; font-weight: bold; transition: background 0.2s; }
        .download-btn:hover { background: #764ba2; }
        .empty-msg { text-align: center; padding: 40px; color: #6b7280; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← 返回地图ID</a>
        <header>
            <h1>地图源代码下载</h1>
            <p class="subtitle">所有玩家上传并通过审核的地图源代码</p>
        </header>

        <div class="list-group" id="sourceList">
            <div class="empty-msg">加载中...</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://xryfrqxelzetzkgsaycl.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_bV150rxd0EeojJEL53Cgwg_Lc3ZUkoU";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadSources() {
            const { data, error } = await supabaseClient
                .from('pvz2_maps')
                .select('*')
                .eq('status', 'approved')
                .neq('source_url', '')
                .order('id', {ascending: true});

            const listEl = document.getElementById('sourceList');
            
            if (error || !data || data.length === 0) {
                listEl.innerHTML = '<div class="empty-msg">暂无源代码可供下载</div>';
                return;
            }

            let html = '';
            data.forEach((item, index) => {
                const fileName = `pvz2.lv${index + 1}.lvx`;
                html += `
                <div class="list-item">
                    <div class="item-info">
                        <h3>${item.name}</h3>
                        <p>作者: ${item.author_name} | 文件: ${fileName}</p>
                    </div>
                    <a href="${item.source_url}" download="${fileName}" class="download-btn" target="_blank">下载源代码</a>
                </div>`;
            });
            listEl.innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', loadSources);
    </script>
</body>
</html>
