<body>

        </header>

        <div class="list-group" id="sourceList">
            <div class="empty-msg">加载中...</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://xryfrqxelzetzkgsaycl.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_bV150rxd0EeojJEL53Cgwg_Lc3ZUkoU";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadSources() {
            const { data, error } = await supabaseClient
                .from('pvz2_maps')
                .select('*')
                .eq('status', 'approved')
                .neq('source_url', '')
                .order('id', {ascending: true});

            const listEl = document.getElementById('sourceList');
            
            if (error || !data || data.length === 0) {
                listEl.innerHTML = '<div class="empty-msg">暂无源代码可供下载</div>';
                return;
            }

            let html = '';
            data.forEach((item, index) => {
                const fileName = `pvz2.lv${index + 1}.lvx`;
                html += `
                <div class="list-item">
                    <div class="item-info">
                        <h3>${item.name}</h3>
                        <p>作者: ${item.author_name} | 文件: ${fileName}</p>
                    </div>
                    <a href="${item.source_url}" download="${fileName}" class="download-btn" target="_blank">下载源代码</a>
                </div>`;
            });
            listEl.innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', loadSources);
    </script>

<body>
<div class="wrap">
<h1 class="page-title">PvZ2 高级创作 · 关卡下载</h1>
<div class="toolbar">
<div class="search-box">
<svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
<input type="text" id="searchInput" placeholder="搜索关卡名称...">
</div>
<button class="btn-all" id="btnAll" onclick="downloadAll()">
<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
<span id="btnAllText">一键全部下载</span>
</button>
</div>
<div class="grid" id="grid"></div>
</div>
<script>
var levels=[
{name:"摇滚年代 坚不可摧",id:"pvz2-lv1.json",file:"pvz2-lv1.json",size:"太空杀124制作",playId:"10001"},
{name:"摇滚年代 大举进攻",id:"pvz2-lv2.json",file:"pvz2-lv2.json",size:"太空杀124制作",playId:"10002"},
{name:"摇滚年代 排山倒海1",id:"pvz2-lv3.json",file:"pvz2-lv3.json",size:"太空杀124制作",playId:"10003"},
{name:"摇滚年代 排山倒海2",id:"pvz2-lv4.json",file:"pvz2-lv4.json",size:"太空杀124制作",playId:"10004"},
{name:"摇滚年代 第29天",id:"pvz2-lv5.json",file:"pvz2-lv5.json",size:"太空杀124制作",playId:"10005"},
{name:"摇滚年代 大总合",id:"pvz2-lv6.json",file:"pvz2-lv6.json",size:"太空杀124制作",playId:"10006"},
{name:"摇滚年代 破阵危机",id:"pvz2-lv7.json",file:"pvz2-lv7.json",size:"太空杀124制作",playId:"10007"},
];
var grid=document.getElementById("grid");
var searchInput=document.getElementById("searchInput");
var btnAll=document.getElementById("btnAll");
var btnAllText=document.getElementById("btnAllText");
function render(list){
grid.innerHTML="";
if(list.length===0){
grid.innerHTML='<div class="empty"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><div>未找到匹配的关卡</div></div>';
return;
}
list.forEach(function(lv){
var card=document.createElement("div");
card.className="card";
card.innerHTML='<div class="card-head"><h3>'+lv.name+'</h3></div>'+
'<div class="card-body">'+
'<div class="info-row"><div class="info-label">关卡编号</div><div class="info-value mono">'+lv.id+'</div></div>'+
'<div class="info-row"><div class="info-label">文件信息</div><div class="info-value">'+lv.file+' · '+lv.size+'</div></div>'+
'<div class="card-actions">'+
'<a class="btn btn-dl" href="'+lv.file+'" download>下载文件</a>'+
'</div></div>';
grid.appendChild(card);
});
}
function getFiltered(){
var kw=searchInput.value.trim().toLowerCase();
if(!kw)return levels.slice();
return levels.filter(function(lv){
return lv.name.toLowerCase().indexOf(kw)>-1||lv.id.toLowerCase().indexOf(kw)>-1;
});
}
searchInput.addEventListener("input",function(){render(getFiltered());});
function downloadAll(){
if(btnAll.classList.contains("loading"))return;
var list=getFiltered();
if(list.length===0)return;
btnAll.classList.add("loading");
btnAllText.textContent="下载中...";
var i=0;
function next(){
if(i>=list.length){
btnAll.classList.remove("loading");
btnAllText.textContent="一键全部下载";
return;
}
var a=document.createElement("a");
a.href=list[i].file;
a.download=list[i].file;
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
i++;
setTimeout(next,500);
}
next();
}
render(levels);
</script>
</body>
